services:
  - type: web
    name: music-source-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FREESOUND_API_KEY
        sync: false
      - key: MCP_ALLOWED_HOSTS
        value: music-source-assistant.onrender.com,music-source-assistant.onrender.com:*
