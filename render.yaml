services:
  - type: web
    name: music-source-assistant
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FREESOUND_API_KEY
        sync: false
      - key: MCP_ALLOWED_HOSTS
        value: music-source-assistant.onrender.com,music-source-assistant.onrender.com:*
      # Free-plan disk is ephemeral: the index is rebuilt from searches after each restart.
      - key: MUSIC_INDEX_PATH
        value: /tmp/music_index.sqlite3
