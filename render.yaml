databases:
  - name: music-source-assistant-db
    databaseName: music_source_assistant_db
    user: music_source_assistant_db_user
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: music-source-assistant
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: music-source-assistant-db
          property: connectionString
      - key: FREESOUND_API_KEY
        sync: false
      - key: MCP_ALLOWED_HOSTS
        value: music-source-assistant.onrender.com,music-source-assistant.onrender.com:*
